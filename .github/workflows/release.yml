name: build.yml
on:
  push:
    tags:
        - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: build
        run: |
          scripts/build_docker.sh

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_tag=$(git describe --tags $(git rev-list --tags --max-count=1))
          sed -i 's/\(#define WGRIB2_VERSION "\).*"$/\1'"${latest_tag}"'"/g' ./for_skytp/config.h
          zip -r ./libwgrib2_${latest_tag}.zip ./for_skytp
          gh release create "${latest_tag}" ./libwgrib2_${latest_tag}.zip
