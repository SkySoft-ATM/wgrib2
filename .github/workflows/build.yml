name: build.yml
on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: install
        run: |
          sudo apt-get update
          sudo apt-get install -y libg2c-dev libg2c0d libaec-dev cmake libnetcdf-dev gfortran

      - name: checkout
        uses: actions/checkout@v4
        with:
          path: wgrib2

      - name: build
        run: |
          cd wgrib2
          scripts/build.sh