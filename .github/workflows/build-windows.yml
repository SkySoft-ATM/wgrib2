name: build-windows.yml
on:
  push:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Setup and install dependencies with vcpkg
        shell: bash
        run: |
          set -e
          git clone https://github.com/microsoft/vcpkg
          ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
          ./vcpkg/vcpkg.exe install hdf5[core,tools]:x64-windows --recurse
          ./vcpkg/vcpkg.exe install netcdf-c:x64-windows --recurse
          ./vcpkg/vcpkg.exe install jasper:x64-windows --recurse
          ./vcpkg/vcpkg.exe install libpng:x64-windows --recurse
          ./vcpkg/vcpkg.exe install libjpeg-turbo:x64-windows --recurse
          ./vcpkg/vcpkg.exe install zlib:x64-windows --recurse
          ./vcpkg/vcpkg.exe install curl:x64-windows --recurse

      - name: Build g2c from source
        shell: bash
        run: |
          git clone https://github.com/NOAA-EMC/NCEPLIBS-g2c
          cd NCEPLIBS-g2c
          git checkout v2.2.0
          cmake -B build -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DCMAKE_INSTALL_PREFIX="${PWD}/install"
          cmake --build build --config Release --parallel
          cmake --install build --config Release

      - name: Build wgrib2
        shell: bash
        run: |
          export g2c_ROOT="${PWD}/NCEPLIBS-g2c/install"
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DBUILD_LIB=ON \
            -DBUILD_SHARED_LIB=ON \
            -DUSE_NETCDF=ON \
            -DUSE_G2CLIB_LOW=ON \
            -Dg2c_DIR="${g2c_ROOT}/lib/cmake/g2c"
          cmake --build build --config Release --parallel

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p for_windows
          cp build/wgrib2/Release/wgrib2.dll for_windows/ 2>/dev/null || cp build/wgrib2/wgrib2.dll for_windows/
          cp build/wgrib2/Release/wgrib2.lib for_windows/ 2>/dev/null || cp build/wgrib2/wgrib2.lib for_windows/ || true
          cp build/config.h for_windows/
          cp wgrib2/wgrib2.h for_windows/
          cp wgrib2/wgrib2_api.h for_windows/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wgrib2-windows-dll
          path: for_windows/
